name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests and Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.2
        ports:
          - 8000:8000

    env:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: ap-south-1
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install ruff==0.17.5
          python -m pip check

      - name: Wait for DynamoDB Local
        run: |
          python - <<'PY'
          import time
          import boto3

          client = boto3.client(
              "dynamodb",
              endpoint_url="http://127.0.0.1:8000",
              region_name="ap-south-1",
              aws_access_key_id="local",
              aws_secret_access_key="local",
          )

          for attempt in range(30):
              try:
                  client.list_tables()
                  print("DynamoDB Local is ready.")
                  break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(2)
          PY

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Python compile check
        run: python -m compileall -q app lambda tests scripts

      - name: Run backend test suite
        run: pytest -q

      - name: Package Lambda functions
        if: matrix.python-version == '3.12'
        run: python scripts/package_lambdas.py

  frontend:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:run

      - name: Build frontend
        run: npm run build

      - name: Run ESLint
        run: npm run lint

  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Package Lambda functions
        working-directory: ${{ github.workspace }}
        run: python scripts/package_lambdas.py

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337
        with:
          tflint_version: v0.66.0

      - name: Terraform formatting check
        working-directory: ${{ github.workspace }}
        run: terraform fmt -check -recursive terraform

      - name: Initialize Terraform without backend
        run: terraform init -backend=false -lockfile=readonly

      - name: Validate Terraform
        run: terraform validate

      - name: Initialize TFLint plugins
        working-directory: terraform
        run: tflint --recursive --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        working-directory: terraform
        run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  container:
    name: Container Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build application image
        run: |
          docker buildx build \
            --load \
            --tag cloudsec-platform:ci \
            .

      - name: Verify image metadata
        run: docker image inspect cloudsec-platform:ci
